name: Firefox FFmpeg.wasm browser test
on:
  push:
    branches: [main]
    paths:
      - 'src/ffmpeg.js'
      - 'src/main.js'
      - 'src/player.js'
      - 'src/clear-key.js'
      - 'tests/clear-key.test.mjs'
      - 'tests/clear-key.firefox.mjs'
      - 'src/styles.css'
      - 'src/bulk.js'
      - 'src/zip.js'
      - 'src/archive-download.js'
      - 'src/library.js'
      - 'src/media-cache.js'
      - 'src/retry.js'
      - 'public/bulk-download-sw.js'
      - 'index.html'
      - 'tests/browser-modes.firefox.mjs'
      - 'scripts/copy-ffmpeg.mjs'
      - 'tests/ffmpeg.firefox.mjs'
      - '.github/workflows/firefox-ffmpeg.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install locked app dependencies
        run: bun ci
      - name: Install Playwright only in CI runner
        run: bun add --dev playwright@1.58.0
      - name: Install Firefox and Chromium for Clear Key comparison
        run: bunx playwright install --with-deps firefox chromium
      - name: Build production site for GitHub Pages
        env:
          VITE_BASE_PATH: /hongguo-dl/
        run: bun run build
      - name: Create a tiny synthetic video fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=32x32:r=1 -t 1 \
            -c:v mpeg4 -q:v 5 -movflags +faststart -y /tmp/ffmpeg-smoke.mp4
          test -s /tmp/ffmpeg-smoke.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=320x180:r=24 -t 4 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -movflags +faststart -y /tmp/ffmpeg-playback.mp4
          test -s /tmp/ffmpeg-playback.mp4
      - name: Generate standards-compliant CENC MP4 fixture with Common PSSH
        run: |
          # FFmpeg's MOV encryption muxer omits Common PSSH; that fixture
          # cannot assert the complete native EME init-data pathway.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=480x270:rate=24 -t 15 \
            -c:v libx264 -preset ultrafast -crf 15 -pix_fmt yuv420p \
            -movflags +faststart -y /tmp/cenc-source.mp4
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-linux-x64 \
            -o /tmp/shaka-packager
          echo '7a3cf35ad146fd7810b4ededab363c8a3e6121d1b2c8391f53863126186f9ee6  /tmp/shaka-packager' | sha256sum --check
          chmod +x /tmp/shaka-packager
          /tmp/shaka-packager in=/tmp/cenc-source.mp4,stream=video,output=/tmp/ffmpeg-cenc.mp4 \
            --enable_raw_key_encryption \
            --keys label=:key_id=11223344556677889900aabbccddeeff:key=00112233445566778899aabbccddeeff \
            --protection_scheme cenc --clear_lead 0
          test $(stat -c %s /tmp/ffmpeg-cenc.mp4) -gt 65536
          grep -a -q 'pssh' /tmp/ffmpeg-cenc.mp4
      - name: Run real FFmpeg.wasm remux in Firefox headless
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/hongguo-dl/ bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/hongguo-dl/ -o /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          node tests/ffmpeg.firefox.mjs /tmp/ffmpeg-smoke.mp4
          node tests/browser-modes.firefox.mjs /tmp/ffmpeg-playback.mp4
          HONGGUO_TEST_BROWSER=chromium node tests/clear-key.firefox.mjs /tmp/ffmpeg-cenc.mp4
          node tests/clear-key.firefox.mjs /tmp/ffmpeg-cenc.mp4
