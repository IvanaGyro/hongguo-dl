name: CENC progressive to fMP4 feasibility (no re-encode)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-cenc-remux.py'
      - '.github/workflows/cenc-remux-feasibility.yml'
      - '.github/actions/setup-media-tools/**'
  pull_request:
    paths:
      - 'scripts/probe-cenc-remux.py'
      - '.github/workflows/cenc-remux-feasibility.yml'
      - '.github/actions/setup-media-tools/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  native-remux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-media-tools
      - name: Check FFmpeg has the HEVC encoder for the synthetic fixture
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx265
          ffprobe -version | head -1
      - name: Verify encrypted progressive input emits clear fMP4 before EOF
        run: python3 scripts/probe-cenc-remux.py
