name: "Registration policy E - adaptive recovery (150s first, 180s base)"
on:
  push:
    branches:
      - experiment/app-isolate-queue-probe-20261113
    paths:
      - experiments/triggers/registration-policy-adaptive-e.txt
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 39
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun ci
      - name: Syntax-check experiment before any real upstream requests
        run: node --check scripts/live-registration-adaptive-e.mjs
      - name: Run adaptive E against real upstream (no media/source requests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/registration-adaptive-e
          bunx wrangler dev worker/registration-id-probe.js --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/registration-adaptive-e/workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then ready=1;break;fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat /tmp/registration-adaptive-e/workerd.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/registration-adaptive-e/workerd.log; exit 1; fi
          node scripts/live-registration-adaptive-e.mjs
      - name: Upload redacted data and exact IDs (1-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-e-registration-records
          path: /tmp/registration-adaptive-e/*records.json
          if-no-files-found: warn
          retention-days: 1
