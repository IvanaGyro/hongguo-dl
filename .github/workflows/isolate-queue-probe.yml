name: Validate unthrottled experimental Worker (offline)
on:
  push:
    branches:
      - experiment/app-isolate-queue-probe-20261113
    paths:
      - .github/workflows/isolate-queue-probe.yml
      - worker/vendor/playback-device.js
      - worker/vendor/app-source.js
      - worker/vendor/empty-response-retry.js
      - tests/playback-device-unthrottled.test.cjs
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install
        run: bun ci
      - name: Unit tests including registration concurrency and no local backoff
        run: bun run test
      - name: Build experimental Worker without deployment
        run: bunx wrangler deploy --dry-run --outdir /tmp/hongguo-unthrottled-worker
