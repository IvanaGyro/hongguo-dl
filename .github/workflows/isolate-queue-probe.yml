name: Probe local workerd isolate scheduling
on:
  push:
    branches:
      - experiment/app-isolate-queue-probe-20261113
    paths:
      - .github/workflows/isolate-queue-probe.yml
      - worker/isolate-queue-probe.js
      - scripts/isolate-queue-probe.mjs
jobs:
  probe-workerd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install project dependencies
        run: bun ci
      - name: Run local workerd isolate and concurrency experiment
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler dev worker/isolate-queue-probe.js --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/isolate-probe-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/health > /tmp/isolate-probe-health.json 2>/dev/null && grep -q '"ok":true' /tmp/isolate-probe-health.json; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/isolate-probe-workerd.log
              exit 1
            fi
            sleep 1
          done
          node scripts/isolate-queue-probe.mjs
