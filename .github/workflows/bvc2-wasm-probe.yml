name: BVC2 Librempeg WASM feasibility (experimental)
on:
  push:
    branches: [main, 'fix/bvc2-stream-download-codecs']
    paths:
      - '.github/workflows/bvc2-wasm-probe.yml'
      - 'scripts/build-bvc2-wasm-transcode.sh'
      - 'scripts/bvc2-transcoder.c'
      - 'scripts/bvc2-avio.h'
      - 'scripts/patch-bvc2-mov.py'
      - 'scripts/build-video-encoders.sh'
      - 'scripts/patch-x265-single-thread.py'
      - 'scripts/vendor/libvvenc.c'
      - 'scripts/bvc2-wasm-bundle.mjs'
      - 'scripts/verify-video-outputs.mjs'
      - 'scripts/synthetic-bvc2.mjs'
      - 'scripts/build-native-vvc-verifier.sh'
      - 'tests/bvc2-stream.browser.mjs'
  workflow_dispatch:
concurrency:
  group: bvc2-wasm-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  decoder-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - name: Install native pkg-config for Librempeg x264 dependency detection
        run: |
          apt-get update -qq
          apt-get install -y pkg-config ffmpeg cmake python3 git >/dev/null
      - name: Validate Emscripten toolchain
        run: |
          emcc --version | head -n 1
          pkg-config --version
          node --version
      - uses: actions/cache/restore@v4
        id: codec-cache
        with:
          path: |
            /tmp/hongguo-bvc2-transcode/dist
            /tmp/hongguo-bvc2-transcode/librempeg.tar.gz
            /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffmpeg
            /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffprobe
          key: video-wasm-emsdk-3.1.74-${{ runner.os }}-${{ hashFiles('scripts/bvc2-transcoder.c', 'scripts/bvc2-avio.h', 'scripts/build-video-encoders.sh', 'scripts/patch-x265-single-thread.py', 'scripts/patch-bvc2-mov.py', 'scripts/vendor/libvvenc.c', 'scripts/build-bvc2-wasm-transcode.sh', 'scripts/build-native-vvc-verifier.sh') }}
      - name: Compile pinned Librempeg BVC2 decoder to WebAssembly
        if: steps.codec-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-bvc2-wasm-probe.sh /tmp/hongguo-bvc2-wasm
      - name: Try linking native BVC2 decode plus x264 encoder as browser WASM
        if: steps.codec-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-bvc2-wasm-transcode.sh /tmp/hongguo-bvc2-transcode
      - name: Reject real H.264 MP4 inputs rather than claiming ByteVC2 decoding
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -nostdin -v error \
            -f lavfi -i testsrc=size=160x90:rate=12 -t 1 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -y /tmp/bvc2-negative-h264.mp4
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            import createModule from "/tmp/hongguo-bvc2-transcode/dist/bvc2-core.mjs";
            const core = await createModule({ wasmBinary:
              readFileSync("/tmp/hongguo-bvc2-transcode/dist/bvc2-core.wasm") });
            assert.equal(core._bvc2_decoder_available(), 1);
            core.FS.writeFile("/not-bvc2.mp4", readFileSync("/tmp/bvc2-negative-h264.mp4"));
            const rc = core.cwrap("bvc2_transcode", "number",
              ["string","string","string"])("/not-bvc2.mp4", "/out.mp4", "");
            assert(rc < 0, "H.264 input must not be misidentified as ByteVC2");
            assert.match(core.UTF8ToString(core._bvc2_last_error()), /not ByteVC2/);
            console.log("PASS BVC2 decoder rejects normal H.264 video");
          '
      - name: Build native VVC verifier for older distro FFmpeg
        if: steps.codec-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-vvc-verifier.sh /tmp/hongguo-bvc2-transcode
      - name: Verify real encoded synthetic video and async fMP4 transport
        env:
          SYNTHETIC_BVC2_PATH: /tmp/hongguo-synthetic-bvc2.mp4
          SYNTHETIC_BVC2_LONG_PATH: /tmp/hongguo-synthetic-bvc2-long.mp4
          VVC_FFMPEG: /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffmpeg
          VVC_FFPROBE: /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffprobe
        run: node scripts/verify-video-outputs.mjs /tmp/hongguo-bvc2-transcode/dist
      # Save only after the actual output/transport checks pass. Browser test
      # fixes can reuse the same source-keyed binary without recompiling codecs.
      - uses: actions/cache/save@v4
        if: steps.codec-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /tmp/hongguo-bvc2-transcode/dist
            /tmp/hongguo-bvc2-transcode/librempeg.tar.gz
            /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffmpeg
            /tmp/hongguo-bvc2-transcode/native/librempeg-cb1f8f3eef84999e61b27e2d44664858179bc240/ffprobe
          key: ${{ steps.codec-cache.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Browser acceptance for ByteVC2 framing and five download modes
        shell: bash
        run: |
          set -euo pipefail
          bun ci
          bun add --dev --no-save playwright@1.58.0
          bunx playwright install --with-deps chromium
          node scripts/bvc2-wasm-bundle.mjs publish /tmp/hongguo-bvc2-transcode/dist
          VITE_BASE_PATH=/hongguo-dl/ bun run build
          VITE_BASE_PATH=/hongguo-dl/ bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/bvc2-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/hongguo-dl/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/bvc2-stream.browser.mjs /tmp/hongguo-synthetic-bvc2.mp4 /tmp/hongguo-synthetic-bvc2-long.mp4
      # Generated artifacts are committed only after the Node.js ABI check.
      # A real ByteVC2 frame fixture is still required for acceptance tests;
      # the web UI displays the converter as an experimental fallback.
      - name: Publish verified browser WASM bundle on the source branch
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # checkout's safe.directory lives in a temporary HOME; subsequent
          # container steps use /github/home and cannot see that setting.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "Publishing from $(pwd), git directory:"
          ls -ld .git || true
          git status --short || true
          node scripts/bvc2-wasm-bundle.mjs publish /tmp/hongguo-bvc2-transcode/dist
          node scripts/bvc2-wasm-bundle.mjs verify
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bvc2/bvc2-core.mjs public/bvc2/bvc2-core.wasm public/bvc2/manifest.json
          if git diff --cached --quiet; then
            echo "Published browser assets already match the verified build"
          else
            git commit -m "build(bvc2): publish JS/WASM with pinned source manifest"
            git fetch origin "$SOURCE_BRANCH"
            git rebase "origin/$SOURCE_BRANCH"
            # Compilation may have started before a later C/source change.
            # Reject stale compiled binaries rather than rebasing them over
            # new source files.
            node scripts/bvc2-wasm-bundle.mjs verify
            git push origin "HEAD:$SOURCE_BRANCH"
            if [[ "$SOURCE_BRANCH" == main ]]; then
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}'
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvc2-wasm-probe
          path: |
            /tmp/hongguo-bvc2-wasm/dist
            /tmp/hongguo-bvc2-wasm/configure.log
            /tmp/hongguo-bvc2-wasm/build.log
            /tmp/hongguo-bvc2-transcode/dist
            /tmp/hongguo-bvc2-transcode/*-configure.log
            /tmp/hongguo-bvc2-transcode/*-build.log
            /tmp/hongguo-bvc2-transcode/build-manifest.txt
            /tmp/hongguo-bvc2-transcode/librempeg-config-debug.log
          if-no-files-found: warn
