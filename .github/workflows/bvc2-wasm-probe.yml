name: BVC2 Librempeg WASM feasibility (experimental)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bvc2-wasm-probe.yml'
      - 'scripts/build-bvc2-wasm-transcode.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - name: Install native pkg-config for Librempeg x264 dependency detection
        run: |
          apt-get update -qq
          apt-get install -y pkg-config >/dev/null
      - name: Validate Emscripten toolchain
        run: |
          emcc --version | head -n 1
          pkg-config --version
          node --version
      - name: Compile pinned Librempeg BVC2 decoder to WebAssembly
        run: bash scripts/build-bvc2-wasm-probe.sh /tmp/hongguo-bvc2-wasm
      - name: Try linking native BVC2 decode plus x264 encoder as browser WASM
        run: bash scripts/build-bvc2-wasm-transcode.sh /tmp/hongguo-bvc2-transcode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvc2-wasm-probe
          path: |
            /tmp/hongguo-bvc2-wasm/dist
            /tmp/hongguo-bvc2-wasm/configure.log
            /tmp/hongguo-bvc2-wasm/build.log
            /tmp/hongguo-bvc2-transcode/dist
            /tmp/hongguo-bvc2-transcode/*-configure.log
            /tmp/hongguo-bvc2-transcode/*-build.log
            /tmp/hongguo-bvc2-transcode/build-manifest.txt
          if-no-files-found: warn
