name: Refresh Bun lock for Video.js (one-time)
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/videojs-lock.yml'
permissions:
  contents: write
concurrency:
  group: videojs-bun-lock
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Resolve and update Bun lockfile
        run: |
          bun install --lockfile-only
          git diff --stat -- bun.lock
      - name: Commit reproducible lockfile
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Video.js HTML components 10.3.0"
            git push origin HEAD:main
          fi
