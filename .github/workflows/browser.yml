name: Browser behaviour specs
# tests/browser/*.spec.mjs, the same specs in Chromium, Firefox and WebKit,
# against the production build with local sample videos and a fake API.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: 'Also run the @slow long-playback specs'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  specs:
    name: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun ci
      - name: Install ${{ matrix.browser }} and FFmpeg
        run: |
          bunx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Cache generated sample videos
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/hongguo-media
          key: hongguo-media-${{ hashFiles('tests/browser/support/fixtures.mjs', 'scripts/derive-fmp4-index-fixtures.mjs') }}
      - name: Run specs
        env:
          HONGGUO_SLOW: ${{ (github.event_name == 'push' || inputs.slow) && '1' || '' }}
        run: bunx playwright test --project=${{ matrix.browser }}
      - name: Upload report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
