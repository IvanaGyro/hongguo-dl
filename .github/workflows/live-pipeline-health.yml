name: Live pipeline health
# Alarms when an external service no longer accepts the current
# implementation: series page, device registration, signed App source
# requests, CDN Range reads and the media container/encryption format.
# Bounded: about ten requests and a few small Range reads per run.
on:
  # No push/PR trigger: a shared GitHub runner IP must not issue upstream
  # requests on every commit.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to test'
        type: choice
        required: true
        default: 'repository'
        options:
          - 'repository'
          - 'deployed'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun ci
      - name: Start the Worker from this commit
        if: ${{ (inputs.worker || 'repository') == 'repository' }}
        shell: bash
        run: |
          set -euo pipefail
          nohup bunx wrangler dev --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/hongguo-workerd.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          echo "Worker failed to start:"; tail -n 40 /tmp/hongguo-workerd.log; exit 1
      - name: Check each external stage
        env:
          LIVE_WORKER_ORIGIN: ${{ (inputs.worker || 'repository') == 'deployed' && 'https://hongguo-dl.ivana-gyro.workers.dev' || 'http://127.0.0.1:8787' }}
        run: node --test --test-reporter=spec tests/live/pipeline-health.test.mjs
