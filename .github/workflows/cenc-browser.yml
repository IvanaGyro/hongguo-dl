name: Progressive CENC MSE real-frame browser acceptance
on:
  push:
    branches: [main, 'fix/cenc-*', 'fix/player-cdn-*']
    paths:
      - '.github/workflows/cenc-browser.yml'
      - 'src/cenc-remux.js'
      - 'src/cenc-remux-worker.js'
      - 'src/fmp4-assembler.js'
      - 'src/clear-key.js'
      - 'src/player.js'
      - 'src/main.js'
      - 'src/cenc-seek.js'
      - 'src/http-range.js'
      - 'src/http-stream.js'
      - 'src/cached-media-reader.js'
      - 'src/media-byte-cache.js'
      - 'src/stream-buffer-policy.js'
      - 'tests/cenc-seek-cache.browser.mjs'
      - 'tests/cenc-worker-reuse.node.mjs'
      - 'src/retry.js'
      - 'tests/cenc-stream.browser.mjs'
      - 'tests/playback-cancel.browser.mjs'
      - 'tests/playback-fallback.browser.mjs'
      - 'public/cenc/**'
  workflow_dispatch:
# Keep an existing acceptance run alive when main advances. Fast first-frame/
# RAP seek tests and 120s pause/1800s playback now run as independent jobs,
# so a long timed check cannot delay the fast verdict or mask its failure.
# GitHub bounds concurrency to one running and one pending workflow run.
concurrency:
  group: cenc-browser-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  browser:
    name: Browser ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        # Focused CENC fixes run real Chromium/Firefox acceptance; main retains both suites.
        suite: ${{ github.ref != 'refs/heads/main' && github.event_name == 'push' && fromJSON('["fast"]') || fromJSON('["fast","long"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CENC_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun ci
      - run: bun add --dev playwright@1.58.0
      - run: bunx playwright install --with-deps chromium firefox
      - name: Assemble output box regression
        run: node --test tests/fmp4-assembler.test.mjs tests/clear-key.test.mjs
      - name: Verify WASM assets are published to branch
        run: |
          test -s public/cenc/cenc-core.wasm
          test -s public/cenc/cenc-core.mjs
      - name: Verify published WASM ABI manifest and asset hashes
        run: node scripts/cenc-wasm-bundle.mjs verify
      - name: Generate large synthetic encrypted H264/AAC progressive sample
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          if [ "$CENC_SUITE" = "fast" ]; then
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 15 -c:v libx264 -preset ultrafast -crf 12 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-stream-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-stream-fixture.mp4) -gt 600000
          ffmpeg -nostdin -v error -decryption_key 00112233445566778899aabbccddeeff \
            -i /tmp/cenc-h264-stream-fixture.mp4 -c copy -f null -
          # 180 seconds: cached seek target exceeds the adaptive MSE lookahead.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 180 -c:v libx264 -preset ultrafast -crf 18 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-seek-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-seek-fixture.mp4) -gt 1048576
          else
          # A longer synthetic CENC movie exercises byte-range backpressure
          # and SourceBuffer eviction, without downloading third-party media.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 300 -c:v libx264 -preset ultrafast -crf 26 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-300s-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-300s-fixture.mp4) -gt 600000
          # 30-minute timeline with low sample-rate video to keep CI CPU and
          # bytes bounded; still exercises real encrypted AVIO/MSE playback.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=6 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 1800 -c:v libx264 -preset ultrafast -crf 32 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 48k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-1800s-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-1800s-fixture.mp4) -gt 600000
          fi
      - name: Build site with new CENC remux Web Worker
        env:
          VITE_BASE_PATH: /hongguo-dl/
        run: bun run build
      - name: Assert browser presents frames before HTTP EOF
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CENC_SUITE" = "fast" ]; then
            # Firefox headless needs a real audio server even for Web Audio's
            # in-browser PCM analyser. A null sink is deterministic on CI
            # without relying on physical sound hardware.
            sudo apt-get install -y pulseaudio pulseaudio-utils >/dev/null
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl info >/dev/null
            pactl load-module module-null-sink sink_name=cenc_ci_audio >/dev/null
            pactl set-default-sink cenc_ci_audio
            echo 'CENC browser PCM virtual audio sink ready'
          fi
          VITE_BASE_PATH=/hongguo-dl/ bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/hongguo-dl/ -o /dev/null; then break; fi
            sleep 1
          done
          if [ "$CENC_SUITE" = "fast" ]; then
          CENC_BROWSER=chromium CENC_TEST_CDN_RETRY=1 CENC_TEST_AUDIO=1 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=firefox CENC_TEST_CDN_RETRY=1 CENC_TEST_AUDIO=1 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=chromium node tests/playback-cancel.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=firefox node tests/playback-cancel.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=chromium node tests/playback-fallback.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=firefox node tests/playback-fallback.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=chromium CENC_TEST_AUDIO=1 CENC_TEST_RANGE_RETRY=1 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-seek-fixture.mp4
          CENC_BROWSER=firefox CENC_TEST_AUDIO=1 CENC_TEST_RANGE_RETRY=1 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-seek-fixture.mp4
          node tests/cenc-worker-reuse.node.mjs /tmp/cenc-h264-seek-fixture.mp4
          CENC_BROWSER=chromium node tests/cenc-seek-cache.browser.mjs /tmp/cenc-h264-seek-fixture.mp4
          CENC_BROWSER=firefox node tests/cenc-seek-cache.browser.mjs /tmp/cenc-h264-seek-fixture.mp4
          else
          CENC_BROWSER=chromium CENC_TEST_STRESS=1 CENC_TEST_PAUSE=1 CENC_TEST_PAUSE_MS=120000 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-300s-fixture.mp4
          CENC_BROWSER=chromium CENC_TEST_STRESS=1 CENC_STRESS_SECONDS=1800 node tests/cenc-stream.browser.mjs /tmp/cenc-h264-1800s-fixture.mp4
          fi
