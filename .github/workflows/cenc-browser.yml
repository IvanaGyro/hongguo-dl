name: CENC preload, prefetch recovery and Worker reuse
on:
  push:
    branches: [main, 'fix/cenc-*', 'fix/player-cdn-*']
    paths:
      - '.github/workflows/cenc-browser.yml'
      - 'src/cenc-remux.js'
      - 'src/stream-preload.js'
      - 'src/player-prefetch.js'
      - 'tests/cenc-preload.browser.mjs'
      - 'src/cenc-remux-worker.js'
      - 'src/media-worker-core.js'
      - 'src/media-worker-local.js'
      - 'src/media-source.js'
      - 'src/media-engine.js'
      - 'src/media-demand.js'
      - 'src/media-route.js'
      - 'src/media-processor.js'
      - 'src/whole-file-read.js'
      - 'src/fmp4-index.js'
      - 'src/fmp4-passthrough.js'
      - 'src/fallback-policy.js'
      - 'src/mp4-metadata.js'
      - 'tests/unit/app/media-worker-local.test.mjs'
      - 'tests/unit/helpers/**'
      - 'tests/unit/app/cenc-remux.test.mjs'
      - 'src/fmp4-assembler.js'
      - 'src/clear-key.js'
      - 'src/player.js'
      - 'src/media-session.js'
      - 'src/download-source-session.js'
      - 'src/media-download.js'
      - 'src/cenc-source-fallback.js'
      - 'src/media-transport.js'
      - 'tests/prefetch-recovery.browser.mjs'
      - 'src/codec-diagnostics.js'
      - 'src/main.js'
      - 'src/cenc-seek.js'
      - 'src/http-range.js'
      - 'src/http-stream.js'
      - 'src/cached-media-reader.js'
      - 'src/media-byte-cache.js'
      - 'src/stream-buffer-policy.js'
      - 'tests/cenc-worker-reuse.node.mjs'
      - 'src/retry.js'
      - 'public/media-core/**'
  pull_request:
    paths:
      - '.github/workflows/cenc-browser.yml'
      - 'src/cenc-remux.js'
      - 'src/stream-preload.js'
      - 'src/player-prefetch.js'
      - 'tests/cenc-preload.browser.mjs'
      - 'src/cenc-remux-worker.js'
      - 'src/media-worker-core.js'
      - 'src/media-worker-local.js'
      - 'src/media-source.js'
      - 'src/media-engine.js'
      - 'src/media-demand.js'
      - 'src/media-route.js'
      - 'src/media-processor.js'
      - 'src/whole-file-read.js'
      - 'src/fmp4-index.js'
      - 'src/fmp4-passthrough.js'
      - 'src/fallback-policy.js'
      - 'src/mp4-metadata.js'
      - 'tests/unit/app/media-worker-local.test.mjs'
      - 'tests/unit/helpers/**'
      - 'tests/unit/app/cenc-remux.test.mjs'
      - 'src/fmp4-assembler.js'
      - 'src/clear-key.js'
      - 'src/player.js'
      - 'src/media-session.js'
      - 'src/download-source-session.js'
      - 'src/media-download.js'
      - 'src/cenc-source-fallback.js'
      - 'src/media-transport.js'
      - 'tests/prefetch-recovery.browser.mjs'
      - 'src/codec-diagnostics.js'
      - 'src/main.js'
      - 'src/cenc-seek.js'
      - 'src/http-range.js'
      - 'src/http-stream.js'
      - 'src/cached-media-reader.js'
      - 'src/media-byte-cache.js'
      - 'src/stream-buffer-policy.js'
      - 'tests/cenc-worker-reuse.node.mjs'
      - 'src/retry.js'
      - 'public/media-core/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    name: Browser ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        # Long playback moved to tests/browser/slow.spec.mjs (browser.yml).
        suite: ['fast']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CENC_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun ci
      - run: bunx playwright install --with-deps chromium firefox
      - name: Assemble output box regression
        run: node --test tests/unit/app/fmp4-assembler.test.mjs tests/unit/app/clear-key.test.mjs
      - name: Verify WASM assets are published to branch
        run: |
          test -s public/media-core/media-core.wasm
          test -s public/media-core/media-core-st.wasm
      - name: Verify published WASM ABI manifest and asset hashes
        run: node scripts/media-core-bundle.mjs verify
      - name: Generate large synthetic encrypted H264/AAC progressive sample
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          if [ "$CENC_SUITE" = "fast" ]; then
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 15 -c:v libx264 -preset ultrafast -crf 12 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-stream-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-stream-fixture.mp4) -gt 600000
          ffmpeg -nostdin -v error -decryption_key 00112233445566778899aabbccddeeff \
            -i /tmp/cenc-h264-stream-fixture.mp4 -c copy -f null -
          # 180 seconds: cached seek target exceeds the adaptive MSE lookahead.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 180 -c:v libx264 -preset ultrafast -crf 18 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-seek-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-seek-fixture.mp4) -gt 1048576
          else
          # A longer synthetic CENC movie exercises byte-range backpressure
          # and SourceBuffer eviction, without downloading third-party media.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 300 -c:v libx264 -preset ultrafast -crf 26 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-300s-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-300s-fixture.mp4) -gt 600000
          # 30-minute timeline with low sample-rate video to keep CI CPU and
          # bytes bounded; still exercises real encrypted AVIO/MSE playback.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=480x270:rate=6 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 1800 -c:v libx264 -preset ultrafast -crf 32 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 48k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y /tmp/cenc-h264-1800s-fixture.mp4
          test $(stat -c %s /tmp/cenc-h264-1800s-fixture.mp4) -gt 600000
          fi
      - name: Build site with new CENC remux Web Worker
        env:
          VITE_BASE_PATH: /hongguo-dl/
        run: bun run build
      - name: Assert browser presents frames before HTTP EOF
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/hongguo-dl/ bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/hongguo-dl/ -o /dev/null; then break; fi
            sleep 1
          done
          # Watching, seeking, fallback and cancellation are behaviour specs in
          # tests/browser (browser.yml). These remain until they are ported.
          TEST_APP_URL=http://127.0.0.1:4173/hongguo-dl/ node tests/prefetch-recovery.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=chromium node tests/cenc-preload.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=firefox node tests/cenc-preload.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=chromium PRELOAD_HANDOFF=manual node tests/cenc-preload.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          CENC_BROWSER=firefox PRELOAD_HANDOFF=manual node tests/cenc-preload.browser.mjs /tmp/cenc-h264-stream-fixture.mp4
          node tests/cenc-worker-reuse.node.mjs /tmp/cenc-h264-seek-fixture.mp4
