name: Real Hongguo HEVC first-frame WebKit on macOS (conditional)
on:
  push:
    branches: [main]
    paths:
      - 'tests/live-hevc.webkit.mjs'
      - 'tests/live-hevc-extended.mjs'
      - 'tests/webkit-media-audio-control.mjs'
      - '.github/workflows/live-hevc-webkit.yml'
      - 'src/cenc-remux.js'
      - 'src/cenc-source-fallback.js'
      - 'src/mse-start-gap.js'
  workflow_dispatch:
concurrency:
  group: real-hevc-webkit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Playwright WebKit
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install webkit
      - name: Ensure FFmpeg is available for synthetic known-audible AAC controls
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
      - name: Check test script syntax
        run: |
          node --check tests/live-hevc.webkit.mjs
          node --check tests/live-hevc-extended.mjs
          node --check tests/webkit-media-audio-control.mjs
      - name: Verify real HEVC first frame, Web Audio PCM and distant seek
        env:
          CENC_WEBKIT_EXTENDED: '1'
        run: node tests/live-hevc.webkit.mjs
