name: Live Worker source smoke (rate limited)
on:
  # Temporary one-time verification on workflow config change; removed next commit.
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-worker-smoke.yml'
  # No push/PR trigger: a shared GitHub runner IP must not issue requests on
  # every commit. The weekly run checks one episode only.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Number of real episodes to probe (max 2; never 60)'
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '2'
permissions:
  contents: read
concurrency:
  group: hongguo-live-origin-smoke
  cancel-in-progress: false
jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Check bounded smoke-test harness without network access
        run: bun test tests/live-worker-smoke.test.mjs
      - name: Probe one or two real episodes (max 256 bytes per CDN)
        env:
          LIVE_EPISODES: ${{ inputs.episodes || '1' }}
        run: bun scripts/live-worker-smoke.mjs
