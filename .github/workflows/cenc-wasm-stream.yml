name: Progressive CENC AVIO WASM proof and pinned bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cenc-wasm-stream.yml'
      - 'scripts/cenc-stream-remux.c'
      - 'scripts/build-cenc-stream-wasm.sh'
      - 'scripts/cenc-wasm-bundle.mjs'
      - 'scripts/verify-cenc-stream-wasm.mjs'
      - 'src/cenc-remux.js'
      - 'src/cenc-remux-worker.js'
      - 'src/fmp4-assembler.js'
      - 'src/clear-key.js'
      - 'tests/fmp4-assembler.test.mjs'
      - 'tests/cenc-wasm-bundle.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/cenc-wasm-stream.yml'
      - 'scripts/cenc-stream-remux.c'
      - 'scripts/build-cenc-stream-wasm.sh'
      - 'scripts/cenc-wasm-bundle.mjs'
      - 'scripts/verify-cenc-stream-wasm.mjs'
      - 'public/cenc/**'
  workflow_dispatch:
concurrency:
  group: cenc-wasm-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '3.1.74'
      - name: Install FFmpeg and generate local synthetic encrypted HEVC + AAC progressive MP4
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg pkg-config >/dev/null
          mkdir -p tests/fixtures
          ffmpeg -nostdin -hide_banner -v error -threads 1 \
            -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 5 -c:v libx265 -preset ultrafast \
            -x265-params pools=none:frame-threads=1:wpp=0:log-level=error:keyint=24:min-keyint=24:scenecut=0 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y tests/fixtures/cenc-hevc-aac.mp4
          test -s tests/fixtures/cenc-hevc-aac.mp4
          ffmpeg -nostdin -hide_banner -v error -threads 1 \
            -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 12 -c:v libx265 -preset ultrafast \
            -x265-params pools=none:frame-threads=1:wpp=0:log-level=error:keyint=24:min-keyint=24:scenecut=0 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y tests/fixtures/cenc-hevc-aac-seek.mp4
          test -s tests/fixtures/cenc-hevc-aac-seek.mp4
          # Browser regressions use the same 70s encrypted H264/AAC source.
          # Exercise Librempeg AVIO at many later random access points without
          # relying on third-party CDN signed URLs or private CENC keys.
          ffmpeg -nostdin -hide_banner -v error \
            -f lavfi -i testsrc=size=480x270:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 70 -c:v libx264 -preset ultrafast -crf 18 -g 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y tests/fixtures/cenc-h264-aac-70s.mp4
          test $(stat -c %s tests/fixtures/cenc-h264-aac-70s.mp4) -gt 1048576
          # Match the real 1080p HEVC source dimensions in a self-generated
          # sample. This proves lossless remux/decode, not browser HEVC support.
          ffmpeg -nostdin -hide_banner -v error -threads 1 \
            -f lavfi -i testsrc=size=1920x1080:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 4 -c:v libx265 -preset ultrafast -crf 27 \
            -x265-params pools=none:frame-threads=1:wpp=0:log-level=error:keyint=24:min-keyint=24:scenecut=0 \
            -pix_fmt yuv420p -c:a aac -b:a 128k \
            -encryption_scheme cenc-aes-ctr \
            -encryption_key 00112233445566778899aabbccddeeff \
            -encryption_kid 11223344556677889900aabbccddeeff \
            -movflags +faststart -y tests/fixtures/cenc-hevc-1080p.mp4
          test -s tests/fixtures/cenc-hevc-1080p.mp4
      - name: Compile and run async CENC AVIO WASM bridge
        shell: bash
        run: bash scripts/build-cenc-stream-wasm.sh /tmp/hongguo-cenc-stream
      - name: Verify output HEVC and AAC can decode
        shell: bash
        run: |
          node scripts/verify-cenc-stream-wasm.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.wasm \
            tests/fixtures/cenc-hevc-aac.mp4 /tmp/clear-fmp4.mp4
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /tmp/clear-fmp4.mp4
          ffmpeg -v error -i /tmp/clear-fmp4.mp4 -f null -
      - name: Verify 1080p HEVC/AAC CENC remux maintains codec and dimensions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cenc-stream-wasm.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.wasm \
            tests/fixtures/cenc-hevc-1080p.mp4 /tmp/clear-fmp4-1080p.mp4
          ffmpeg -nostdin -v error -i /tmp/clear-fmp4-1080p.mp4 -f null -
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {execFileSync} from "node:child_process";
            const tracks = JSON.parse(execFileSync("ffprobe", [
              "-v", "error", "-show_entries",
              "stream=codec_name,width,height,codec_type",
              "-of", "json", "/tmp/clear-fmp4-1080p.mp4"
            ], {encoding: "utf8"})).streams;
            const video = tracks.find(track => track.codec_type === "video");
            const audio = tracks.find(track => track.codec_type === "audio");
            assert.deepEqual([video.codec_name, video.width, video.height],
              ["hevc", 1920, 1080]);
            assert.equal(audio?.codec_name, "aac");
            console.log("PASS synthetic 1080p HEVC/AAC lossless CENC stream copy");
          '
      - name: Verify indexed AVFormat seek with nonzero-byte HTTP Range
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cenc-stream-wasm.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.mjs \
            /tmp/hongguo-cenc-stream/dist/cenc-core.wasm \
            tests/fixtures/cenc-hevc-aac-seek.mp4 /tmp/clear-fmp4-seek.mp4 6
          ffmpeg -v error -i /tmp/clear-fmp4-seek.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries packet=pts_time \
            -of csv=p=0 /tmp/clear-fmp4-seek.mp4 | head -n 4
          node --input-type=module -e '
            import {execFileSync} from "node:child_process";
            const out = execFileSync("ffprobe", [
              "-v", "error", "-select_streams", "v:0", "-show_entries",
              "packet=pts_time", "-of", "csv=p=0", "/tmp/clear-fmp4-seek.mp4"
            ], {encoding:"utf8"});
            const first = Number(out.trim().split(/\s+/)[0]);
            if (!(first >= 3 && first <= 7)) {
              throw new Error("Seek output timeline does not match source: " + first);
            }
            console.log("PASS seek first output video PTS", first);
          '
      - name: Strict video and AAC decode across 70s H264 CENC indexed seeks
        shell: bash
        run: |
          set -euo pipefail
          for second in 7 35 55 63; do
            output="/tmp/cenc-h264-aac-seek-${second}.mp4"
            node scripts/verify-cenc-stream-wasm.mjs \
              /tmp/hongguo-cenc-stream/dist/cenc-core.mjs \
              /tmp/hongguo-cenc-stream/dist/cenc-core.wasm \
              tests/fixtures/cenc-h264-aac-70s.mp4 "$output" "$second"
            # -xerror makes an AAC decryption/decoder error fail the job
            # rather than merely printing an ffmpeg diagnostic to stderr.
            ffmpeg -nostdin -hide_banner -v error -xerror \
              -i "$output" -map 0:v:0 -map 0:a:0 -t 3 -f null -
            ffprobe -v error -show_entries stream=codec_name \
              -of csv=p=0 "$output" | grep -Fxq h264
            ffprobe -v error -show_entries stream=codec_name \
              -of csv=p=0 "$output" | grep -Fxq aac
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import {execFileSync} from "node:child_process";
              const second = Number(process.argv[1]);
              const file = process.argv[2];
              for (const type of ["v:0", "a:0"]) {
                const pts = execFileSync("ffprobe", [
                  "-v", "error", "-select_streams", type,
                  "-show_entries", "packet=pts_time", "-of", "csv=p=0", file
                ], {encoding:"utf8"}).trim().split(/\s+/).map(Number).filter(Number.isFinite);
                assert(pts.length > 0, "Missing " + type + " packets after seek");
                assert(pts[0] >= second - 3 && pts[0] <= second + 1,
                  "Incorrect " + type + " PTS after seek: " + pts[0]);
              }
              console.log("PASS H264/AAC pinned WASM seek strict decode:", second);
            ' "$second" "$output"
          done
      - name: Test box assembly and WASM manifest guards
        run: node --test tests/fmp4-assembler.test.mjs tests/clear-key.test.mjs tests/cenc-wasm-bundle.test.mjs
      - name: Publish verified JS/WASM pair directly to main
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/cenc-wasm-bundle.mjs publish /tmp/hongguo-cenc-stream/dist
          node scripts/cenc-wasm-bundle.mjs verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cenc/cenc-core.mjs public/cenc/cenc-core.wasm public/cenc/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(cenc): publish verified JS/WASM pair and provenance"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            # A GITHUB_TOKEN push does not trigger push-based Pages or CI.
            # workflow_dispatch explicitly runs Pages on the new main HEAD.
            gh workflow run pages.yml --ref main
          fi
      - name: Verify main holds the exact tested bundle
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cenc-wasm-bundle.mjs verify
          cmp /tmp/hongguo-cenc-stream/dist/cenc-core.mjs public/cenc/cenc-core.mjs
          cmp /tmp/hongguo-cenc-stream/dist/cenc-core.wasm public/cenc/cenc-core.wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-cenc-remux
          path: |
            /tmp/hongguo-cenc-stream/dist/
            /tmp/hongguo-cenc-stream/configure.log
            /tmp/hongguo-cenc-stream/build.log
            /tmp/hongguo-cenc-stream/link.log
          if-no-files-found: warn
