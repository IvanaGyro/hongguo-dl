name: Temporary build of H.264-tuned ByteVC2 WASM
on:
  push:
    branches:
      - feat/h264-download-speed-size-slider
    paths:
      - .github/workflows/tmp-h264-download-wasm.yml

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare pinned Emscripten toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 git autoconf automake libtool
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 3.1.74
          /tmp/emsdk/emsdk activate 3.1.74
      - name: Build matching ByteVC2 runtime
        shell: bash
        run: |
          source /tmp/emsdk/emsdk_env.sh
          bash scripts/build-bvc2-wasm-transcode.sh /tmp/hongguo-bvc2-transcode
          node scripts/bvc2-wasm-bundle.mjs publish /tmp/hongguo-bvc2-transcode/dist
          node scripts/bvc2-wasm-bundle.mjs verify
      - name: Validate browser assets and H.264 exports
        run: |
          node --check src/main.js
          node --check src/bvc2-worker.js
          node --test tests/unit/app/h264-download-tradeoff.test.mjs tests/unit/app/bvc2-job.test.mjs
          grep -q 'bvc2_convert_h264' public/bvc2/bvc2-core.mjs || {
            echo 'Missing exported bvc2_convert_h264 in generated module'
            exit 1
          }
      - name: Commit regenerated runtime to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bvc2/bvc2-core.mjs public/bvc2/bvc2-core.wasm public/bvc2/manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build(bvc2): publish H.264 preset-aware WASM runtime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: h264-runtime-build-logs
          path: |
            /tmp/hongguo-bvc2-transcode/*.log
            /tmp/hongguo-bvc2-transcode/build-manifest.txt
          if-no-files-found: ignore
