name: "Registration risk study C2 - 150 real upstream registrations at 2s intervals"
on:
  push:
    branches:
      - experiment/app-isolate-queue-probe-20261113
    paths:
      - .github/workflows/registration-policy-c2.yml
      - scripts/live-registration-window-c2.mjs
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun ci
      - name: Start workerd; conduct real registration-only measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/registration-policy-c2
          bunx wrangler dev worker/registration-id-probe.js --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/registration-policy-c2/workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat /tmp/registration-policy-c2/workerd.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/registration-policy-c2/workerd.log; exit 1; fi
          node scripts/live-registration-window-c2.mjs
      - name: Upload redacted records and full IDs with 1-day retention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-policy-c2
          path: /tmp/registration-policy-c2/*records.json
          if-no-files-found: warn
          retention-days: 1
