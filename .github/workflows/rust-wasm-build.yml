name: Verify Rust SM3 WebAssembly
on:
  push:
    branches: [main, feat/rust-wasm-crypto]
    paths:
      - 'rust/crypto/Cargo.toml'
      - 'rust/crypto/Cargo.lock'
      - 'rust/crypto/src/**'
      - 'rust/crypto/dist/**'
      - 'worker/entry.js'
      - 'worker/rust-sm3.cjs'
      - 'tests/rust-sm3.test.cjs'
      - '.github/workflows/rust-wasm-build.yml'
  pull_request:
    paths:
      - 'rust/crypto/**'
      - 'worker/entry.js'
      - 'worker/rust-sm3.cjs'
      - 'tests/rust-sm3.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - name: Rust unit tests
        run: cargo test --manifest-path rust/crypto/Cargo.toml --locked
      - name: Compile Rust to wasm32
        run: cargo build --manifest-path rust/crypto/Cargo.toml --locked --release --target wasm32-unknown-unknown
      - name: Verify precompiled Wasm exactly matches Rust source
        run: cmp rust/crypto/target/wasm32-unknown-unknown/release/hongguo_crypto.wasm rust/crypto/dist/hongguo_crypto.wasm
      - name: Upload verified WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-rust-sm3
          path: rust/crypto/dist/hongguo_crypto.wasm
