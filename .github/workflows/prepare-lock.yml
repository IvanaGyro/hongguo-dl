name: Prepare Bun lockfile
on:
  push:
    branches: [feat/cloudflare-browser-downloader]
jobs:
  write-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Generate resolved Bun lockfile
        run: bun install --lockfile-only
      - name: Commit lockfile to feature branch
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: add reproducible Bun dependency lockfile'
            git push origin HEAD:feat/cloudflare-browser-downloader
          fi
