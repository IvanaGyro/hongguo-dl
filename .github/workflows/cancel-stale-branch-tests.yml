name: Cancel stale branch tests

# This gate has no path filter. It cancels old runs even when the new commit
# does not touch a path that would trigger a specific test workflow.
on:
  push:
    branches:
      - '**'
  # Trusted base-branch workflow; never checkout or execute PR code here.
  # Unlike pull_request, this can cancel stale runs for forks as well.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: read

# Only one cancellation gate for a given source repository + branch.
# Do NOT share this concurrency group with test workflows: separate tests
# for the *same* commit must continue running in parallel.
concurrency:
  group: stale-tests-${{ github.event.pull_request.head.repo.id || github.repository_id }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel queued and running tests from older commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const branch = pr?.head?.ref || context.ref.slice('refs/heads/'.length);
            const sourceRepoId = pr?.head?.repo?.id || context.payload.repository?.id;
            if (!sourceRepoId || !branch) throw new Error('Missing source repository or branch');

            // A delayed gate must NEVER cancel runs of a commit newer than
            // the event that started it.
            let currentSha;
            if (pr) {
              const { data: latest } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number
              });
              if (latest.head.repo?.id !== sourceRepoId ||
                  latest.head.ref !== branch) return;
              currentSha = latest.head.sha;
              if (currentSha !== pr.head.sha) {
                core.info('Superseded pull request event; skipping cancellation.');
                return;
              }
            } else {
              const { data: latest } = await github.rest.repos.getBranch({
                owner, repo, branch
              });
              currentSha = latest.commit.sha;
              if (currentSha !== context.sha) {
                core.info('Superseded push event; skipping cancellation.');
                return;
              }
            }

            const statuses = ['in_progress', 'queued', 'requested', 'waiting', 'pending'];
            const handled = new Set();
            let cancelled = 0;
            // A short second pass catches workflow runs that only become
            // visible after this cancellation gate begins.
            for (let sweep = 0; sweep < 2; sweep++) {
              for (const status of statuses) {
                for (let page = 1; page <= 10; page++) {
                  const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                    owner, repo, branch, status, per_page: 100, page
                  });
                  for (const run of data.workflow_runs) {
                    if (handled.has(run.id) || run.head_sha === currentSha ||
                        run.head_branch !== branch ||
                        run.head_repository?.id !== sourceRepoId ||
                        run.id === context.runId) continue;
                    // Deployments are not tests. The cancellation gate has its
                    // own native concurrency and should not cancel itself.
                    if (run.name === 'Deploy GitHub Pages' ||
                        run.name === 'Cancel stale branch tests') continue;
                    handled.add(run.id);
                    try {
                      await github.rest.actions.cancelWorkflowRun({
                        owner, repo, run_id: run.id
                      });
                      cancelled++;
                      core.info(`Cancelled stale ${run.name} run #${run.id} (${run.head_sha})`);
                    } catch (error) {
                      // The run may have completed between listing and cancelling.
                      if (![404, 409, 422].includes(error.status)) throw error;
                    }
                  }
                  if (data.workflow_runs.length < 100) break;
                }
              }
              if (sweep === 0) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.info(`Branch ${branch} at ${currentSha}: cancelled ${cancelled} obsolete run(s).`);
