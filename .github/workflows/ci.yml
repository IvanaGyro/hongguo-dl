name: CI
on:
  push:
    branches: [main, feat/cloudflare-browser-downloader]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install using Bun
        run: bun install
      - name: Tests using Bun
        run: bun run test
      - name: Build GitHub Pages assets
        env:
          VITE_BASE_PATH: /hongguo-dl/
        run: bun run build
      - name: Verify Pages asset base
        run: grep -q '/hongguo-dl/assets/' dist/index.html
      - name: Cloudflare Worker dry-run
        run: bunx wrangler deploy --dry-run --outdir /tmp/hongguo-worker
