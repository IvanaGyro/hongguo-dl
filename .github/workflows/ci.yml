name: CI
on:
  push:
    branches: [main, feat/cloudflare-browser-downloader, feat/rust-wasm-crypto]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install using Bun
        run: bun ci
      - name: Tests using Bun
        run: bun run test
      - name: Verify committed CENC JS/WASM bundle and build inputs
        run: node scripts/cenc-wasm-bundle.mjs verify
      - name: Verify experimental BVC2 JS/WASM pair and pinned source inputs
        run: node scripts/bvc2-wasm-bundle.mjs verify
      - name: Build GitHub Pages assets
        env:
          VITE_BASE_PATH: /hongguo-dl/
        run: bun run build
      - name: Verify Pages asset base
        run: grep -q '/hongguo-dl/assets/' dist/index.html
      - name: Cloudflare Worker dry-run
        run: bunx wrangler deploy --dry-run --outdir /tmp/hongguo-worker
      # Wrangler's dry-run only bundles files. Actually starting workerd catches
      # invalid top-level I/O (e.g. node:crypto randomBytes during module load).
      - name: Cloudflare Worker cold-start smoke test
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler dev --local --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > /tmp/hongguo-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/api/health > /tmp/hongguo-health.json 2>/dev/null &&
               grep -q '"ok":true' /tmp/hongguo-health.json; then
              echo "Worker cold-start and GET /api/health succeeded"
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "Wrangler exited unexpectedly:"
              cat /tmp/hongguo-workerd.log
              exit 1
            fi
            sleep 1
          done
          echo "Worker failed to start within smoke-test window:"
          cat /tmp/hongguo-workerd.log
          exit 1

  rendition-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun ci
      - run: bun add --dev playwright@1.58.0
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Verify rendition menus and source-failure CENC retry in Chromium
        shell: bash
        run: |
          set -euo pipefail
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/rendition-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ -o /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/rendition-menu.browser.mjs
          node tests/design-layout.browser.mjs

      - name: Upload responsive design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-design-layout
          path: test-results/design-layout/*.png
          if-no-files-found: ignore
